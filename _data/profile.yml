# Bio paragraphs. Add as many list items as you like. HTML/links are allowed.
# Tip:  <code>keyword</code>  -> blue highlight (for concepts)
#       <a href="...">text</a> -> blue link, no highlight (for real links)
bio:
  - >
    I am a PhD student in Electrical Engineering and Computer Sciences at
    <a href="https://eecs.berkeley.edu/">UC Berkeley</a>, advised by Edward Chang
    and Gopala Anumanchipalli (tentative).
  - >
    I research how data-driven AI models can advance our understanding of neural
    computation and build bidirectional brain-computer interfaces (BCI) to safely
    interact with our nervous system. My work centers on three threads:
    <code>Closed-loop neurostimulation</code>,
    <code>Neural population dynamics</code>, and
    <code>Neural engineering for basic science</code>.<br>
    My work is supported by the
    <a href="https://www.nsfgrfp.org/">NSF Graduate Research Fellowship Program (GRFP)</a>.
  - >
    During my undergraduate studies, I worked on real-time AI for a DARPA-funded
    wearable focused ultrasound system for closed-loop sleep modulation under
    <a href="https://scholar.google.com/citations?user=ssU-Mj0AAAAJ&hl=en&oi=ao">Huiliang Wang</a> and
    <a href="https://scholar.google.com/citations?user=T1EUMu0AAAAJ&hl=en&oi=ao">José del R. Millán</a>.
    I also worked on optimizing single-neuron closed-loop stimulation using in vivo
    calcium imaging under <a href="https://scholar.google.com/citations?user=VHO0m2AAAAAJ&hl=en&oi=ao">Lief Fenno</a>.
  - >
    At UT Austin, I co-founded and grew
    <a href="https://www.instagram.com/lhneurotech/">Longhorn Neurotech</a> into a
    250-member BCI community, leading outreach initiatives across Texas and the
    United States. I also interned at
    <a href="https://www.microsoft.com/en-us/research/group/audio-and-acoustics-research-group/">Microsoft Research's Audio and Acoustics Research Group</a>,
    where I worked with <a href="https://scholar.google.com/citations?user=JO7k5rQAAAAJ&hl=en&oi=ao">Ivan Tashev</a>
    and <a href="https://scholar.google.com/citations?user=S1CeYaQAAAAJ&hl=en&oi=ao">Dimitra Emmanouilidou</a>
    on self-supervised foundation models for transferable neurovascular representations.
  - >
    I write here to document ideas at the intersection of neuroscience, AI, and
    the philosophy of mind.

