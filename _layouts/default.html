<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.summary | default: site.description | strip_html | escape }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | strip_html | escape }}">
  <meta property="og:type" content="{% if page.collection == 'writings' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/tony.jpeg' | absolute_url }}">
  <meta property="og:image:alt" content="Tony Chae">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
  <meta name="twitter:description" content="{{ page.summary | default: site.description | strip_html | escape }}">
  <meta name="twitter:image" content="{{ '/assets/tony.jpeg' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
</head>
<body>
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}">Home</a>
    <a href="{{ '/#publications' | relative_url }}">Publications</a>
    <a href="{{ '/writings/' | relative_url }}">Writings</a>
  </nav>

  <main>
    {{ content }}
  </main>

  {% if page.collection == "writings" %}
    {% include subscribe.html %}
  {% endif %}

  <footer class="site-footer">
    &copy; {{ site.time | date: "%Y" }} <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  </footer>
</body>
</html>
